<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>clix · 座位定位示範</title>
<style>
:root{--font-sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#f4f6f9,#e7ecf1);font-family:var(--font-sans);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 14px;color:#2a3a39}
.wrap{width:100%;max-width:720px}
.cap{text-align:center;font-size:12px;color:#93a0ac;letter-spacing:.14em;margin-top:14px}
.card{background:#eef1f5;border:1px solid #e2e6ec;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(40,58,57,.12)}
.shine{position:absolute;top:0;left:0;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg) translateX(-180%);animation:shine 1.5s cubic-bezier(.4,0,.2,1) .35s 1;pointer-events:none;z-index:3}
.pad{padding:15px 16px 12px}
.hdr{display:flex;align-items:center;gap:11px;position:relative;z-index:2}
.badge{width:38px;height:38px;border-radius:50%;background:#167A67;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both;box-shadow:0 0 0 3px rgba(224,168,0,.26)}

.nrow{display:flex;align-items:center;gap:8px}
.name{font-size:19px;font-weight:500;color:#2a3a39}
.name .ch{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(9px);animation:chin .55s cubic-bezier(.2,.7,.2,1) forwards}
.vip{font-size:9.5px;font-weight:500;color:#8a6205;background:linear-gradient(180deg,#ffe9a8,#f4c531);border:1px solid #e0a800;border-radius:5px;padding:1px 6px;letter-spacing:.1em;opacity:0;animation:rise .5s ease .85s both}
.seat{margin-left:auto;text-align:right;opacity:0;animation:rise .5s ease .5s both}
.slbl{font-size:10.5px;color:#7c8797;letter-spacing:.16em}
.sval{font-size:19px;font-weight:500;color:#b5820a}
.no{display:inline-block;min-width:.9em;animation:gp .6s ease 1.3s both}
.orn{display:flex;align-items:center;gap:8px;margin-top:9px;transform:scaleX(0);transform-origin:center;animation:grow .9s ease .5s forwards}
.ol{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9a94a)}
.ol:last-child{background:linear-gradient(90deg,#c9a94a,transparent)}
.od{width:7px;height:7px;background:#e0a800;transform:rotate(45deg);flex:none;box-shadow:0 0 0 3px rgba(224,168,0,.2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#64748b;margin-top:2px;letter-spacing:.04em}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
@keyframes shine{to{transform:skewX(-18deg) translateX(340%)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rip{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.7);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes chin{to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes gp{0%{color:#e0a800;text-shadow:0 0 14px rgba(224,168,0,.8)}100%{color:#b5820a;text-shadow:none}}
@keyframes pz{0%{transform:scale(.5);opacity:.8}80%{transform:scale(2.8);opacity:0}100%{opacity:0}}
@keyframes pz2{0%{transform:scale(.6);opacity:.55}80%{transform:scale(3.8);opacity:0}100%{opacity:0}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes tw{0%,100%{opacity:.14;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="shine"></div>
    <div style="height:3px;background:linear-gradient(90deg,#167A67,#e0a800,#167A67)"></div>

          <linearGradient id="ray" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#e7c877" stop-opacity="0.14"/><stop offset="100%" stop-color="#e7c877" stop-opacity="0"/></linearGradient>
          <linearGradient id="stg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1d8f78"/><stop offset="100%" stop-color="#12604f"/></linearGradient>
        </defs>
      </svg>
      <div class="legend">
        <span><span class="sw" style="background:#e0a800"></span>你的座位</span>
        <span><span class="sw" style="background:#aebeb4"></span>一般席</span>
        <span><span class="sw" style="background:#fff;border:1.4px solid #167A67"></span>輪椅席</span>
        <span><span class="sw" style="background:#167A67;border-radius:3px"></span>排號</span>
      </div>
    </div>
  </div>
  <div class="cap">clix · 座位定位示範 DEMO</div>
</div>
